<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bear With Me — reunite lost things</title>
    <link rel="stylesheet" href="/finder/styles.css">
    <style>
      a { color: #2f5d9e; font-weight: 700; }
      .actions { display: grid; gap: 12px; }
      .actions a { display: block; background: #f1f5f8; border-radius: 10px; padding: 14px; text-decoration: none; }
      .actions a:hover { background: #e5edf4; }
    </style>

  <body>
    <main class="shell">
      <p class="eyebrow">BEAR WITH ME</p>
      <h1>Reunite lost things without exposing identity.</h1>
      <p class="muted">A finder can report an item, the owner can receive a private notification, and both sides can chat anonymously.</p>
      <section class="card actions">
        <a href="/f">Found something? Open the finder page</a>
        <a href="/owner">Open the owner web fallback</a>
        <a href="/authority">Open the authority recovery portal</a>
      </section>
    </main>
  </body>
