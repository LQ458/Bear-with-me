<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Whoops Tag — owner</title>
    <link rel="stylesheet" href="/finder/styles.css">
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="Primary">
        <a class="brand" href="/"><span class="brand-mark">↗</span>WHOOPS TAG<span>RETURN SYSTEM</span></a>
        <div class="nav-links"><a href="/f">Finder</a><a href="/authority">Authority</a></div>
      </nav>
      <header class="page-intro">
        <p class="eyebrow">OWNER ACCESS</p>
        <h1>Your things, quietly findable.</h1>
        <p class="lede">Register or log in to manage tags and receive private recovery messages.</p>
      </header>
      <section id="login" class="card auth-card">
        <div class="auth-tabs" role="tablist" aria-label="Owner access">
          <button id="register-tab" type="button" aria-selected="true">Register</button>
          <button id="login-tab" type="button" aria-selected="false">Log in</button>
        </div>
        <form id="register-form">
          <label for="name">Name</label>
          <input id="name" required>
          <label for="email">Email</label>
          <input id="email" type="email" required>
          <button>Open owner account</button>
        </form>
        <form id="login-form" class="hidden">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email" required>
          <p class="muted">A one-time sign-in token keeps owner contact details private. Enter it below to continue.</p>
          <button id="request-login" type="button">Send magic link</button>
          <div id="login-step" class="hidden">
            <label for="magic-token">One-time sign-in token</label>
            <input id="magic-token" autocomplete="one-time-code" required>
            <button id="complete-login" type="button">Continue to owner account</button>
          </div>
        </form>
      </section>
      <section id="dashboard" class="hidden">
        <div class="card">
          <button id="logout" type="button">Close owner account</button>
          <h2>Found reports</h2>
          <div id="events"></div>
        </div>
        <div class="card">
          <h2>Inventory</h2>
          <form id="item-form">
            <label for="item-label">Item name</label>
            <input id="item-label" placeholder="Ducky" required>
            <label for="item-description">Private description (optional)</label>
            <input id="item-description" placeholder="Scratches near the cap">
            <button>Add item</button>
          </form>
          <div id="items"></div>
        </div>
      </section>
      <section id="chat" class="card hidden">
        <h2 id="chat-title">Anonymous chat</h2>
        <ul id="messages" class="messages"></ul>
        <form id="message-form" class="message-form">
          <input id="message" maxlength="2000" placeholder="Reply anonymously" required>
          <button>Send</button>
        </form>
        <button id="call-button" type="button">Start return call</button>
        <p id="call-status" class="muted" aria-live="polite"></p>
      </section>
      <p id="status" class="muted" aria-live="polite"></p>
    </main>
    <script src="/owner/app.js" defer></script>
  </body>
</html>
